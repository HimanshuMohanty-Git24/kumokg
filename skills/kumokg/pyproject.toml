[project]
name = "kumokg"
version = "1.0.0"
description = "KumoKG: universal knowledge-graph construction, verification, GraphRAG exploration and top-10 database export."
readme = "SKILL.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "COMMERCIAL_LICENSE.md"]
authors = [{ name = "Himanshu Mohanty" }]
keywords = ["knowledge-graph", "graphrag", "agent-skill", "provenance", "neo4j", "rdf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "networkx>=3.3",
    "rdflib>=7.0",
    "duckdb>=1.1",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
docling = ["docling"]
mcp = ["mcp>=1.2"]
neo4j = ["neo4j>=5.0"]
postgres = ["psycopg[binary]>=3.1"]
memgraph = ["neo4j>=5.0"]
falkordb = ["falkordb>=1.0"]
neptune = ["boto3>=1.34", "gremlinpython>=3.7"]
arangodb = ["python-arango>=8.0"]
tigergraph = ["pyTigerGraph>=1.6"]
janusgraph = ["gremlinpython>=3.7"]
rdf = ["httpx>=0.27"]
all-db = [
    "neo4j>=5.0",
    "psycopg[binary]>=3.1",
    "falkordb>=1.0",
    "boto3>=1.34",
    "gremlinpython>=3.7",
    "python-arango>=8.0",
    "pyTigerGraph>=1.6",
    "httpx>=0.27",
]

[project.scripts]
kumokg = "kumokg_cli:main"

[project.urls]
Homepage = "https://github.com/HimanshuMohanty-Git24/kumokg"
Repository = "https://github.com/HimanshuMohanty-Git24/kumokg"
Issues = "https://github.com/HimanshuMohanty-Git24/kumokg/issues"
"Commercial License" = "https://github.com/HimanshuMohanty-Git24/kumokg/blob/main/COMMERCIAL_LICENSE.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["scripts"]

[tool.hatch.build.targets.wheel]
only-include = ["scripts"]
sources = ["scripts"]

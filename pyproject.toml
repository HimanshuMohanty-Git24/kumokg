[project]
name = "kumokg-dev"
version = "1.0.0"
description = "Development & test harness for the self-contained KumoKG agent skill (skills/kumokg)."
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = ["kumokg[mcp]"]

[tool.uv]
package = false

[tool.uv.sources]
kumokg = { path = "skills/kumokg", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs the optional docker-compose.test.yml database stack (KUMOKG_LIVE_TESTS=1)"]
addopts = "-m \"not live\" -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:rdflib"]

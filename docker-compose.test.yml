# Optional live-push integration stack for KumoKG.
#   docker compose -f docker-compose.test.yml up -d
#   KUMOKG_LIVE_TESTS=1 uv run --project skills/kumokg --extra all-db pytest -m live
# The default `uv run pytest` never needs these services (offline bundles + in-process doubles cover every adapter).
services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/kumokg-test
      NEO4J_PLUGINS: '[]'
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "kumokg-test", "RETURN 1"]
      interval: 10s
      retries: 12

  memgraph:
    image: memgraph/memgraph:latest
    ports: ["7688:7687"]

  postgres-age:
    image: apache/age:latest
    environment:
      POSTGRES_USER: kumokg
      POSTGRES_PASSWORD: kumokg
      POSTGRES_DB: kumokg
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumokg"]
      interval: 5s
      retries: 20

  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379"]

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    ports: ["7878:7878"]
